name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d aegis_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AEGIS_TEST_DATABASE_URL: postgres://test:test@localhost:5432/aegis_test?sslmode=disable
      AEGIS_TEST_REDIS_URL: redis://localhost:6379/1
      # Real-process lifecycle acceptance (startup/readiness/graceful shutdown/
      # restart persistence) runs in the public schema of the same database.
      AEGIS_OPS_DATABASE_URL: postgres://test:test@localhost:5432/aegis_test?sslmode=disable
      AEGIS_OPS_REDIS_URL: redis://localhost:6379/2
      # The runner has a Docker daemon. Forcing the flag makes the container
      # sandbox test fail rather than skip when the runtime disappears.
      AEGIS_TEST_DOCKER: "1"
      GIN_MODE: release
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Vet
        run: go vet ./...
      - name: Test (race, real PostgreSQL and Redis)
        run: go test -race ./... -count=1
      - name: Build
        run: go build ./cmd/server

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          # Disposable per-run database; tests bootstrap and migrate it.
          POSTGRES_DB: aegis_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d aegis_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 20
    env:
      AEGIS_E2E_DATABASE_URL: postgres://test:test@localhost:5432/aegis_e2e?sslmode=disable
      AEGIS_E2E_REDIS_URL: redis://localhost:6379/3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Playwright starts the real Go backend and Vite dev server itself.
      - name: Browser tests (real backend, frontend, PostgreSQL, Redis)
        run: npm run test:e2e
      # Traces and the page snapshot in error-context.md are the only way to
      # diagnose a browser-only failure after the runner is gone.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

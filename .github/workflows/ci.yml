name: CI

# Third-party actions are pinned to a full commit SHA with the human-readable
# version in a trailing comment, and container images to a tag@sha256 digest, so
# a moved tag cannot silently change what CI executes. The Dependabot
# github-actions group keeps the SHAs current; refresh image digests deliberately
# when the tags are bumped. The digests below are the multi-arch manifest-list
# digests recorded by Docker's official image metadata (docker-library/repo-info,
# generated from the registry API).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d aegis_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AEGIS_TEST_DATABASE_URL: postgres://test:test@localhost:5432/aegis_test?sslmode=disable
      AEGIS_TEST_REDIS_URL: redis://localhost:6379/1
      # Real-process lifecycle acceptance (startup/readiness/graceful shutdown/
      # restart persistence) runs in the public schema of the same database.
      AEGIS_OPS_DATABASE_URL: postgres://test:test@localhost:5432/aegis_test?sslmode=disable
      AEGIS_OPS_REDIS_URL: redis://localhost:6379/2
      # The runner has a Docker daemon. Forcing the flag makes the container
      # sandbox test fail rather than skip when the runtime disappears.
      AEGIS_TEST_DOCKER: "1"
      GIN_MODE: release
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Vet
        run: go vet ./...
      - name: Test (race, real PostgreSQL and Redis, coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./... -count=1
      # Statement-coverage floor for the backend suite. Measured on 2026-11-25
      # against real PostgreSQL 17 + Redis 7.4 with the race detector: 77.6%
      # total. CI runs additional Linux-only tests, so its profile should be at
      # least this (the separate root-only run below is not part of the
      # profile). The floor is deliberately conservative: measured coverage
      # - 3 points, rounded down to a multiple of 5. Raise it (never lower it)
      # as the number improves.
      - name: Enforce backend statement-coverage floor
        run: |
          set -eu
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          printf 'total backend statement coverage: %s%%\n' "$total"
          floor=70
          if awk -v got="$total" -v floor="$floor" 'BEGIN { exit !(got + 0 < floor) }'; then
            printf 'error: backend coverage %s%% is below the %s%% floor (see the workflow comment)\n' "$total" "$floor" >&2
            exit 1
          fi
      - name: Build
        run: go build ./cmd/server
      # The user sandbox only works as root (chown + setpriv); the regular test
      # run skips that one test, so CI executes it explicitly through sudo.
      - name: User sandbox privilege drop (root)
        run: sudo env PATH="$PATH" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE=/tmp/aegis-go-cache HOME=/tmp go test ./internal/builds -run TestUserSandboxRunsAsTargetAccount -count=1 -v

  # Supply-chain gate. The Go module graph was upgraded together with the Go
  # toolchain (#81), so reachable module-level vulnerabilities are expected to be
  # zero; a finding now blocks the PR. govulncheck@latest declares a newer Go
  # toolchain than backend/go.mod's `go` directive, so the scanner is built with
  # the latest stable toolchain while the module graph it scans is still
  # backend/go.mod. Standard-library findings track the scanner toolchain: keep
  # `go-version: stable` current instead of reintroducing continue-on-error.
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Blocking: a reachable vulnerability in the scanned module graph fails
      # the job (the module baseline is upgraded, so this is a regression gate
      # now). Standard-library findings are fixed by keeping `go-version` on a
      # current stable patch release, not by making this step advisory again.
      - name: Scan for known vulnerabilities
        run: '"$(go env GOPATH)/bin/govulncheck" ./...'

  # The backend job runs on Linux. This job keeps the Windows development path
  # (cmd /c build commands, taskkill on process trees) compiling and vetted.
  # Only packages that need no PostgreSQL/Redis run here; the full suite runs in
  # the backend job.
  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify formatting
        shell: pwsh
        run: |
          $unformatted = gofmt -l ./cmd ./internal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted) {
            Write-Host 'gofmt reported unformatted files:'
            $unformatted | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test packages without external services
        run: go test ./internal/config ./internal/metrics -count=1

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      # Blocking: the lockfile currently audits clean (0 vulnerabilities). Only
      # high/critical findings fail; lower severities are reported but allowed,
      # matching the project's existing lint-warning policy.
      - name: Audit dependencies (high and critical)
        run: npm audit --audit-level=high

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          # Disposable per-run database; tests bootstrap and migrate it.
          POSTGRES_DB: aegis_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d aegis_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 20
    env:
      AEGIS_E2E_DATABASE_URL: postgres://test:test@localhost:5432/aegis_e2e?sslmode=disable
      AEGIS_E2E_REDIS_URL: redis://localhost:6379/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Playwright starts the real Go backend and Vite dev server itself.
      - name: Browser tests (real backend, frontend, PostgreSQL, Redis)
        run: npm run test:e2e
      # Traces and the page snapshot in error-context.md are the only way to
      # diagnose a browser-only failure after the runner is gone.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Packaging and deployment config regression checks. The placeholders below
  # exist only so compose interpolation (${VAR:?}) resolves; no service is run
  # against them and no secret is involved.
  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AEGIS_POSTGRES_PASSWORD: ci-placeholder-postgres-password
      AEGIS_JWT_SECRET: ci-placeholder-jwt-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Builds the production image from backend/Dockerfile so a broken
      # Dockerfile or Go version drift is caught here instead of at release.
      - name: Build the backend image
        run: docker build -t aegisflow-api:ci ./backend
      # Fails on any unresolved ${VAR:?...} or malformed service definition;
      # also proves the required variables are the ones documented.
      - name: Validate compose interpolation
        run: docker compose config -q
      # The gateway config is bind-mounted by compose; check it with the same
      # nginx image the stack uses. nginx resolves upstream hostnames while
      # loading the config, so the isolated container needs api1/api2 in
      # /etc/hosts; nothing listens or is served, only the config is validated.
      - name: Validate the gateway nginx config
        run: docker run --rm --add-host api1:127.0.0.1 --add-host api2:127.0.0.1 -v "$PWD/deploy/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236 nginx -t

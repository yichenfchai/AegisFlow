events {}
http {
  upstream aegis_api {
    server api1:8080;
    server api2:8080;
  }
  server {
    listen 8080;
    client_max_body_size 16k;

    # Server-Sent Events for build logs: disable proxy buffering and keep the
    # upstream read timeout above the 15s heartbeat while staying below the
    # 10 minute server cap. Keep this before the generic location.
    location ~ ^/api/v1/builds/[^/]+/events$ {
      proxy_pass http://aegis_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # Overwrite inbound forwarding headers; trust only this gateway's exact address.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP "";
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_connect_timeout 3s;
      proxy_read_timeout 11m;
      proxy_send_timeout 11m;
    }

    location / {
      proxy_pass http://aegis_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # Overwrite inbound forwarding headers; trust only this gateway's exact address.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP "";
      proxy_set_header Connection "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 35s;
      # Never replay login/refresh/logout on another upstream after a partial failure.
      proxy_next_upstream off;
    }
  }
}

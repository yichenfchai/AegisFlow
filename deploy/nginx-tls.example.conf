# Production-shaped example only: terminate TLS here and keep the API replicas
# on plain HTTP inside a private network. Replace the certificate paths, the
# server name and the upstream addresses, and keep AEGIS_TRUSTED_PROXIES equal
# to this proxy's address (the app ignores X-Forwarded-For from anything else).
#
# Same-origin rule: the SPA and /api/v1 must be served from one HTTPS host so
# the refresh cookie (SameSite=Strict, Path=/api/v1/auth) works and
# AEGIS_COOKIE_SECURE=true can stay on. Cross-site deployments are out of scope.

events {}

http {
  upstream aegis_api {
    server api1:8080;
    server api2:8080;
    keepalive 32;
  }

  server {
    listen 80;
    server_name aegis.example.com;
    # Keep the ACME HTTP-01 challenge reachable while redirecting everything else.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name aegis.example.com;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1h;

    # Enable HSTS only after the HTTPS entry is permanent; drop includeSubDomains
    # if any subdomain still speaks plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # The API never accepts large bodies (strict JSON handlers cap at 16 KiB).
    client_max_body_size 16k;

    # Server-Sent Events: never buffer, and keep the upstream read timeout
    # above the 15s heartbeat while staying below the 10 minute server cap.
    location ~ ^/api/v1/builds/[^/]+/events$ {
      proxy_pass http://aegis_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP "";
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_connect_timeout 3s;
      proxy_read_timeout 11m;
      proxy_send_timeout 11m;
    }

    location / {
      proxy_pass http://aegis_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # Overwrite inbound forwarding headers; trust only this gateway's address.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP "";
      proxy_set_header Connection "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 35s;
      # Never replay login/refresh/logout on another upstream after a partial
      # failure: a refresh that already committed upstream must not run twice.
      proxy_next_upstream off;
      proxy_buffering off;
    }
  }
}

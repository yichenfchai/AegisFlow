# Production-shaped example only: terminate TLS here, keep the API replicas on
# plain HTTP inside a private network, and serve the built SPA from the same
# origin. Replace the certificate paths, the server name, the upstream
# addresses and the static root with the real values, and keep
# AEGIS_TRUSTED_PROXIES equal to this proxy's address (the app ignores
# X-Forwarded-For from anything else).
#
# Same-origin rule: the SPA and /api/v1 are served from one HTTPS host, so the
# refresh cookie (SameSite=Strict, Path=/api/v1/auth) works and
# AEGIS_COOKIE_SECURE=true can stay on. Cross-site deployments are out of scope.
# Set AEGIS_ALLOWED_ORIGINS to the browser-visible origin(s), e.g.
# https://aegis.example.com.
#
# SPA files: run `npm run build` at the repository root and sync the generated
# dist/ directory into the root below (/usr/share/nginx/html). See the
# "前端静态资源" section in deploy/README.md.
#
# Upstream note: a static upstream list is resolved once at start. When API
# replicas are recreated with new addresses, run `nginx -t && nginx -s reload`,
# or switch to a resolver/service discovery with active health checks.

events {}

http {
  upstream aegis_api {
    server api1:8080;
    server api2:8080;
    keepalive 32;
  }

  server {
    listen 80;
    server_name aegis.example.com;
    # Keep the ACME HTTP-01 challenge reachable while redirecting everything else.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name aegis.example.com;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1h;

    # Enable HSTS only after the HTTPS entry is permanent; drop includeSubDomains
    # if any subdomain still speaks plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # The API never accepts large bodies (strict JSON handlers cap at 16 KiB).
    client_max_body_size 16k;

    # SPA build output (index.html, assets/, public/ files). Adjust if mounted
    # elsewhere; keep it in sync with the build/deploy steps in deploy/README.md.
    root /usr/share/nginx/html;

    # Server-Sent Events: never buffer, and keep the upstream read timeout above
    # the 15s heartbeat while staying below the 10 minute server cap.
    location ~ ^/api/v1/builds/[^/]+/events$ {
      proxy_pass http://aegis_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP "";
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_connect_timeout 3s;
      proxy_read_timeout 11m;
      proxy_send_timeout 11m;
    }

    # Liveness/readiness stay on the API; the SPA fallback below must not
    # swallow them (a 200 HTML body would look healthy to a monitor).
    location ~ ^/(healthz|readyz)$ {
      proxy_pass http://aegis_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP "";
      proxy_set_header Connection "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 35s;
      proxy_next_upstream off;
    }

    # All API traffic, including auth cookies; never cache these responses.
    location /api/ {
      proxy_pass http://aegis_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # Overwrite inbound forwarding headers; trust only this gateway's address.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP "";
      proxy_set_header Connection "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 35s;
      # Never replay login/refresh/logout on another upstream after a partial
      # failure: a refresh that already committed upstream must not run twice.
      proxy_next_upstream off;
      # The app already sends Cache-Control: no-store on every API response;
      # do not add add_header here, it would stop inheriting the server-level
      # security headers for API responses.
      proxy_buffering off;
    }

    # Vite emits content-hashed files under assets/; cache them for a year.
    location /assets/ {
      try_files $uri =404;
      expires 1y;
    }

    # The entry document must be revalidated so a new release is picked up;
    # try_files falls back here for client-side routes.
    location = /index.html {
      expires -1;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}

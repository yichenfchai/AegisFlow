          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Review' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/reviews/{reviewId}/approve:
    post:
      tags: [Reviews]
      operationId: approveReview
      summary: Approve a pending review (global admin or project maintainer)
      description: |
        Moves a pending review to approved and records decidedBy/decidedAt plus
        the optional reason, in one transaction with a review.approve audit row.
        Repeating on an already approved review is idempotent and writes no
        second audit row; any other non-pending status is 409. An invisible
        project stays 404; a visible project the caller does not maintain is 403.
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveReviewInput' }
      responses:
        '200':
          description: Approved (or already approved) review
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Review' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/reviews/{reviewId}/reject:
    post:
      tags: [Reviews]
      operationId: rejectReview
      summary: Reject a pending review (global admin or project maintainer)
      description: |
        Moves a pending review to rejected and records decidedBy/decidedAt plus
        the required reason, in one transaction with a review.reject audit row.
        reason is required, trimmed, at most 512 bytes and single-line.
        Repeating on an already rejected review is idempotent and writes no
        second audit row; any other non-pending status is 409.
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectReviewInput' }
      responses:
        '200':
          description: Rejected (or already rejected) review
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Review' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/reviews/{reviewId}/cancel:
    post:
      tags: [Reviews]
      operationId: cancelReview
      summary: Cancel a pending review (requester, global admin or project maintainer)
      description: |
        The requester may withdraw their own pending request; everybody else
        needs the reviewer overlay (global admin or project maintainer).
        decidedBy/decidedAt record who cancelled and when; reason stays absent
        because the cancel payload carries no reason. Repeating on an already
        cancelled review is idempotent and writes no second audit row; approval
        or rejection is a conflict (409).
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody: { $ref: '#/components/requestBodies/EmptyObject' }
      responses:
        '200':
          description: Cancelled (or already cancelled) review
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Review' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/reviews/{reviewId}/external-results:
    get:
      tags: [Reviews]
      operationId: listReviewExternalResults
      summary: List external review results (visible projects)
      description: |
        Newest first, capped at the 50 most recent rows. The read follows the
        same project visibility predicate as the review: an invisible project
        answers 404 so private review ids stay non-enumerable. External results
        are evidence only; they never change the review status.
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      responses:
        '200':
          description: External result list, newest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/ReviewExternalResultList' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Reviews]
      operationId: ingestReviewExternalResult
      summary: Append a signed external review result (HMAC webhook, no session)
      description: |
        Machine-to-machine webhook for external scanners or review tools. It is
        not a browser session route and requires no Bearer token: the caller
        proves possession of AEGIS_REVIEW_WEBHOOK_SECRET by signing the exact raw
        body. Required headers: X-AegisFlow-Timestamp (Unix seconds, within 300s
        of the server clock), X-AegisFlow-Signature
        (sha256=<hex HMAC-SHA256(secret, timestamp + "." + rawBody)>) and
        X-AegisFlow-Delivery (8-128 characters of A-Z a-z 0-9 . _ -, the
        idempotency key). A missing, malformed, stale or future-dated signature
        header is 401. The payload appends one immutable result to an existing
        review and never changes the review state machine. A repeated delivery
        id returns the stored result with 200 (no new row); a new delivery
        returns 201. Unknown review ids are 404. When AEGIS_REVIEW_WEBHOOK_SECRET
        is unset the whole endpoint answers 503 while the GET route stays
        available to authenticated readers.
      security: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
        - { $ref: '#/components/parameters/ExternalResultTimestamp' }
        - { $ref: '#/components/parameters/ExternalResultSignature' }
        - { $ref: '#/components/parameters/ExternalResultDelivery' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReviewExternalResultInput' }
      responses:
        '201':
          description: External result appended
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/ReviewExternalResult' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '200':
          description: Delivery id already stored; the original result is returned unchanged
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/ReviewExternalResult' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Missing, invalid, stale or future-dated X-AegisFlow signature headers or delivery id; error.code is unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: AEGIS_REVIEW_WEBHOOK_SECRET is not configured; error.code is dependencies_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /api/v1/projects/{projectId}/scans:
    get:
      tags: [Scans]
      operationId: listProjectScans
      summary: List a project's scan results (visible projects)
      description: |
        Newest first, filtered by project visibility: an invisible private
        project answers 404 rather than an empty page. verdict is optional and
        limited to passed/failed/warning.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - name: verdict
          in: query
          required: false
          description: Filter by scan verdict; omit for all
          schema: { type: string, enum: [passed, failed, warning] }
      responses:
        '200':
          description: Scan page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/ScanPage' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Scans]
      operationId: ingestScan
      summary: Append a signed scan result (HMAC webhook, no session)
      description: |
        Machine-to-machine webhook for external scanning tools; AegisFlow never
        runs a scanner itself. It is not a browser session route and requires no
        Bearer token: the caller proves possession of
        AEGIS_INGEST_WEBHOOK_SECRET by signing the exact raw body. Required
        headers: X-AegisFlow-Timestamp (Unix seconds, within 300s of the server
        clock), X-AegisFlow-Signature
        (sha256=<hex HMAC-SHA256(secret, timestamp + "." + rawBody)>) and
        X-AegisFlow-Delivery (8-128 characters of A-Z a-z 0-9 . _ -, the
        idempotency key). A missing, malformed, stale or future-dated signature
        header is 401. The payload appends one immutable scan row to an existing
        project. A repeated delivery id returns the stored row with 200 (no new
        row); a new delivery returns 201. Unknown projects are 404. When
        AEGIS_INGEST_WEBHOOK_SECRET is unset the endpoint answers 503 while the
        read routes stay available. The response never contains signing headers
        or secret material.
      security: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
        - { $ref: '#/components/parameters/IngestTimestamp' }
        - { $ref: '#/components/parameters/IngestSignature' }
        - { $ref: '#/components/parameters/IngestDelivery' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateScanInput' }
      responses:
        '201':
          description: Scan result appended
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Scan' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '200':
          description: Delivery id already stored; the original scan is returned unchanged
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Scan' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Missing, invalid, stale or future-dated X-AegisFlow signature headers or delivery id; error.code is unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The stored delivery row was removed concurrently; retry with a new deliveryId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: AEGIS_INGEST_WEBHOOK_SECRET is not configured; error.code is dependencies_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /api/v1/scans:
    get:
      tags: [Scans]
      operationId: listScans
      summary: List scan results across projects (visible projects)
      description: |
        Newest first, restricted to the projects the caller can see: a global
        admin sees every scan, while other roles see scans of public projects
        plus projects they created or belong to. projectId and verdict are
        optional filters; filtering by an invisible project returns an empty
        page instead of an error, matching the global review and deployment
        lists, so the filter cannot be used to enumerate private project ids.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - name: projectId
          in: query
          required: false
          description: Filter by project id; omit for all visible projects
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
        - name: verdict
          in: query
          required: false
          description: Filter by scan verdict; omit for all
          schema: { type: string, enum: [passed, failed, warning] }
      responses:
        '200':
          description: Scan page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/ScanPage' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/scans/{scanId}:
    get:
      tags: [Scans]
      operationId: getScan
      summary: Get one scan result (visible projects)
      description: An invisible project is 404, exactly like the project itself.
      security:
        - bearerAuth: []
      parameters:
        - name: scanId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      responses:
        '200':
          description: Scan result with its project name and delivery evidence
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Scan' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/security-events:
    get:
      tags: [SecurityEvents]
      operationId: listSecurityEvents
      summary: List defense events (admin-only)
      description: |
        Newest occurrence first, filtered by the optional severity, status and
        source query parameters. Defense events are global administrative
        objects: member/viewer callers receive 403.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - name: severity
          in: query
          required: false
          description: Filter by severity; omit for all
          schema: { type: string, enum: [low, medium, high, critical] }
        - name: status
          in: query
          required: false
          description: Filter by status; omit for all
          schema: { type: string, enum: [open, acknowledged] }
        - name: source
          in: query
          required: false
          description: Filter by external source name (exact match)
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Defense event page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/SecurityEventPage' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [SecurityEvents]
      operationId: ingestSecurityEvent
      summary: Append a signed defense event (HMAC webhook, no session)
      description: |
        Machine-to-machine webhook for external detection tools; AegisFlow never
        runs a detection engine itself. It is not a browser session route and
        requires no Bearer token: the caller proves possession of
        AEGIS_INGEST_WEBHOOK_SECRET by signing the exact raw body. Required
        headers: X-AegisFlow-Timestamp (Unix seconds, within 300s of the server
        clock), X-AegisFlow-Signature
        (sha256=<hex HMAC-SHA256(secret, timestamp + "." + rawBody)>) and
        X-AegisFlow-Delivery (8-128 characters of A-Z a-z 0-9 . _ -, the
        idempotency key). A missing, malformed, stale or future-dated signature
        header is 401. The payload appends one immutable event that stays open
        until an administrator acknowledges it. A repeated delivery id returns
        the stored event with 200 (no new row); a new delivery returns 201. When
        AEGIS_INGEST_WEBHOOK_SECRET is unset the endpoint answers 503 while the
        read routes stay available.
      security: []
      parameters:
        - { $ref: '#/components/parameters/IngestTimestamp' }
        - { $ref: '#/components/parameters/IngestSignature' }
        - { $ref: '#/components/parameters/IngestDelivery' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSecurityEventInput' }
      responses:
        '201':
          description: Defense event appended; status is open
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/SecurityEvent' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '200':
          description: Delivery id already stored; the original event is returned unchanged
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/SecurityEvent' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Missing, invalid, stale or future-dated X-AegisFlow signature headers or delivery id; error.code is unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: The stored delivery row was removed concurrently; retry with a new deliveryId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: AEGIS_INGEST_WEBHOOK_SECRET is not configured; error.code is dependencies_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /api/v1/security-events/{eventId}:
    get:
      tags: [SecurityEvents]
      operationId: getSecurityEvent
      summary: Get one defense event (admin-only)
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      responses:
        '200':
          description: Defense event with its acknowledgement state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/SecurityEvent' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/security-events/{eventId}/ack:
    post:
      tags: [SecurityEvents]
      operationId: ackSecurityEvent
      summary: Acknowledge a defense event (admin-only)
      description: |
        Moves an open event to acknowledged and records acknowledgedBy,
        acknowledgedByName and acknowledgedAt, in one transaction with a
        security_event.ack audit row whose detail only carries the event id,
        severity and type (never the summary). Repeating on an already
        acknowledged event is idempotent and writes no second audit row. An
        unknown event is 404 and a non-admin caller is 403.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody: { $ref: '#/components/requestBodies/EmptyObject' }
      responses:
        '200':
          description: Acknowledged (or already acknowledged) defense event
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/SecurityEvent' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 access token, checked against a live PostgreSQL session and current user role
    refreshCookie:
      type: apiKey
      in: cookie
      name: aegis_refresh
      description: HttpOnly host-only cookie set/rotated by login/refresh; JavaScript must never read or set it
  parameters:
    AuthOrigin:
      name: Origin
      in: header
      required: true
      description: Exactly one browser Origin, matching AEGIS_ALLOWED_ORIGINS exactly; required on all auth POSTs even same-origin and scripts
      schema: { type: string, example: 'http://localhost:5173' }
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, default 20, between 1 and 100
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      required: false
      description: Zero-based page offset
      schema: { type: integer, minimum: 0, default: 0 }
    ExternalResultTimestamp:
      name: X-AegisFlow-Timestamp
      in: header
      required: true
      description: Unix seconds; must be within 300s of the server clock (replay window)
      schema: { type: integer, format: int64 }
    ExternalResultSignature:
      name: X-AegisFlow-Signature
      in: header
      required: true
      description: 'sha256=<hex HMAC-SHA256(AEGIS_REVIEW_WEBHOOK_SECRET, timestamp + "." + rawBody)>'
      schema: { type: string, pattern: '^sha256=[a-f0-9]{64}$' }
    ExternalResultDelivery:
      name: X-AegisFlow-Delivery
      in: header
      required: true
      description: 8-128 characters of A-Z a-z 0-9 . _ -; the sender's idempotency key
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{8,128}$' }
    IngestTimestamp:
      name: X-AegisFlow-Timestamp
      in: header
      required: true
      description: Unix seconds; must be within 300s of the server clock (replay window)
      schema: { type: integer, format: int64 }
    IngestSignature:
      name: X-AegisFlow-Signature
      in: header
      required: true
      description: 'sha256=<hex HMAC-SHA256(AEGIS_INGEST_WEBHOOK_SECRET, timestamp + "." + rawBody)>'
      schema: { type: string, pattern: '^sha256=[a-f0-9]{64}$' }
    IngestDelivery:
      name: X-AegisFlow-Delivery
      in: header
      required: true
      description: 8-128 characters of A-Z a-z 0-9 . _ -; globally unique idempotency key
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{8,128}$' }
  requestBodies:
    EmptyObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            maxProperties: 0
          example: {}
  headers:
    RequestID:
      description: Same value as the envelope requestId
      schema: { $ref: '#/components/schemas/RequestID' }
    BearerChallenge:
      schema: { type: string, enum: [Bearer] }
    RefreshCookie:
      description: |
        aegis_refresh=<opaque>; Path=/api/v1/auth; HttpOnly; SameSite=Strict;
        Secure only when explicitly configured. remember=true adds Max-Age and
        Expires bounded by the original absolute deadline. No Domain attribute.
      schema: { type: string }
    DeletedRefreshCookie:
      description: Empty aegis_refresh cookie with matching Path/HttpOnly/SameSite/Secure, Max-Age=0 and an expired Expires
      schema: { type: string }
  schemas:
    RequestID:
      type: string
      pattern: '^[a-f0-9]{32}$'
    User:
      type: object
      additionalProperties: false
      required: [id, username, displayName, role, disabled, createdAt]
      properties:
        id: { type: string }
        username: { $ref: '#/components/schemas/Username' }
        displayName:
          type: string
          description: Valid UTF-8, at most 256 bytes
        role: { type: string, enum: [admin, member, viewer] }
        disabled:
          type: boolean
          description: Disabled accounts cannot log in and have no active sessions
        createdAt:
          type: integer
          format: int64
          description: Unix seconds; 0 means unknown for rows created before the account-management migration
    Username:
      type: string
      minLength: 3
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{2,63}$'
      description: ASCII only; uniqueness and login lookup are case-insensitive
    Password:
      type: string
      format: password
      writeOnly: true
      description: 12-72 UTF-8 bytes (byte limits, not Unicode character limits); bcrypt hashed
    LoginInput:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password, writeOnly: true }
        remember: { type: boolean, default: false }
    CreateUserInput:
      type: object
      additionalProperties: false
      required: [username, password, role]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        password: { $ref: '#/components/schemas/Password' }
        displayName:
          type: string
          description: Optional, defaults to username if empty; valid UTF-8, at most 256 bytes
        role: { type: string, enum: [admin, member, viewer] }
    TokenData:
      type: object
      additionalProperties: false
      required: [user, accessToken, expiresIn]
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string, description: Short-lived Bearer JWT; keep in memory }
        expiresIn: { type: integer, format: int64, minimum: 1, description: 'Access lifetime in seconds, capped by the absolute session deadline' }
    ChangePasswordInput:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password, writeOnly: true }
        newPassword: { $ref: '#/components/schemas/Password' }
    UpdateUserInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: { type: string, enum: [admin, member, viewer] }
        disabled: { type: boolean }
    ResetPasswordInput:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { $ref: '#/components/schemas/Password' }
    SessionInfo:
      type: object
      additionalProperties: false
      required: [id, createdAt, expiresAt, remember, current]
      properties:
        id: { type: string, description: 'Opaque session identifier, not a token' }
        createdAt:
          type: integer
          format: int64
          description: Unix seconds; 0 means unknown for pre-migration sessions
        expiresAt: { type: integer, format: int64, description: 'Absolute Unix deadline, never extended by rotation' }
        remember: { type: boolean }
        current: { type: boolean, description: True for the session that issued the request }
    UserPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    Project:
      type: object
      additionalProperties: false
      required: [id, name, description, repoUrl, defaultBranch, status, visibility, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string }
        name:
          type: string
          description: 3-64 UTF-8 bytes, unique case-insensitively; no path or shell meta characters
        description:
          type: string
          description: At most 512 bytes
        repoUrl:
          type: string
          description: https:// or git@ git URL, file:/// URL, or an absolute local path; empty allowed
        defaultBranch:
          type: string
          description: Plain git ref name; empty allowed
        buildCommand:
          type: string
          description: Single-line shell command executed in a temporary workdir; builds require it
        status: { type: string, enum: [active, archived] }
        visibility:
          type: string
          enum: [public, private]
          description: |
            public (default) is readable by every authenticated role. private is
            visible only to global admins, the creator and project members; an
            invisible project answers 404 rather than 403.
        createdBy: { type: string, description: Actor id snapshot of the creating user }
        createdAt: { type: integer, format: int64, description: Unix seconds }
        updatedAt: { type: integer, format: int64, description: Unix seconds }
    ProjectInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        repoUrl: { type: string }
        defaultBranch: { type: string }
        buildCommand: { type: string, maxLength: 512 }
        visibility: { type: string, enum: [public, private], description: Defaults to public when omitted }
    ProjectPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string }
        description: { type: string }
        repoUrl: { type: string }
        defaultBranch: { type: string }
        buildCommand: { type: string, maxLength: 512 }
        visibility: { type: string, enum: [public, private] }
        archived:
          type: boolean
          description: true archives (idempotent); false restores an archived project
    ProjectMember:
      type: object
      additionalProperties: false
      required: [projectId, userId, username, role, createdBy, createdAt]
      properties:
        projectId: { type: string }
        userId: { type: string }
        username: { type: string, description: Resolved from the auth account; empty if the account no longer exists }
        role: { type: string, enum: [maintainer, viewer] }
        createdBy: { type: string, description: Actor id snapshot of who granted the membership }
        createdAt: { type: integer, format: int64, description: Unix seconds }
    ProjectMemberInput:
      type: object
      additionalProperties: false
      required: [userId, role]
      properties:
        userId: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
        role: { type: string, enum: [maintainer, viewer] }
    ProjectMemberPatch:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { type: string, enum: [maintainer, viewer] }
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    Build:
      type: object
      additionalProperties: false
      required: [id, projectId, buildNumber, status, branch, command, repoUrl, triggeredBy, createdAt, startedAt, finishedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        buildNumber: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled, interrupted], description: interrupted marks builds cut off by a restart }
        branch: { type: string }
        command: { type: string, description: Command snapshot at trigger time }
        repoUrl: { type: string, description: Repository URL snapshot at trigger time; empty means the build ran without cloning }
        triggeredBy: { type: string, description: Actor id snapshot }
        createdAt: { type: integer, format: int64, description: Unix seconds }
        startedAt: { type: integer, format: int64, description: Unix seconds; 0 while queued }
        finishedAt: { type: integer, format: int64, description: Unix seconds; 0 while unfinished }
    LogEvent:
      type: object
      additionalProperties: false
      required: [id, buildId, stream, message, createdAt]
      properties:
        id: { type: integer, format: int64, description: Monotonic event id; the polling cursor and future SSE resume sequence }
        buildId: { type: string }
        stream: { type: string, enum: [stdout, stderr, system] }
        message: { type: string, description: At most 4096 bytes per line, rune-boundary truncated }
        createdAt: { type: integer, format: int64, description: Unix seconds }
    BuildPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Build' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    DeploymentTargetOption:
      type: object
      additionalProperties: false
      required: [id, name, environment, endpoint]
      properties:
        id: { type: string }
        name: { type: string }
        environment: { type: string, enum: [development, staging, production] }
        endpoint: { type: string }
    DeploymentTarget:
      type: object
      additionalProperties: false
      required: [id, name, kind, environment, endpoint, healthPath, deployPath, hasSecret, status, createdBy, createdAt, updatedAt, lastCheckAt, lastCheckOk, lastCheckDetail]
      properties:
        id: { type: string }
        name: { type: string, description: Unique case-insensitively; 3-64 bytes on one line }
        kind: { type: string, enum: [http] }
        environment: { type: string, enum: [development, staging, production] }
        endpoint: { type: string, format: uri, description: http(s) URL without userinfo, query or fragment }
        healthPath: { type: string, description: Appended to endpoint for the probe; starts with / }
        deployPath: { type: string, description: Appended to endpoint for the deploy POST; starts with /, default /deploy }
        hasSecret: { type: boolean, description: Whether a sealed credential is stored; the secret itself is never returned }
        status: { type: string, enum: [active, disabled] }
        createdBy: { type: string, description: Actor id snapshot }
        createdAt: { type: integer, format: int64, description: Unix seconds }
        updatedAt: { type: integer, format: int64, description: Unix seconds }
        lastCheckAt: { type: integer, format: int64, description: Unix seconds of the last probe; 0 means never probed }
        lastCheckOk: { type: boolean }
        lastCheckDetail: { type: string, description: "ok, http <code>, timeout or a sanitized network error" }
    DeploymentTargetInput:
      type: object
      additionalProperties: false
      required: [name, endpoint]
      properties:
        name: { type: string, minLength: 3, maxLength: 64 }
        kind: { type: string, enum: [http], default: http }
        environment: { type: string, enum: [development, staging, production], default: development }
        endpoint: { type: string, format: uri, description: http(s) URL without userinfo, query or fragment }
        healthPath: { type: string, default: '/', maxLength: 256 }
        deployPath: { type: string, default: '/deploy', maxLength: 256 }
        secret: { type: string, writeOnly: true, maxLength: 4096, description: Sent as Authorization Bearer for probes and deploys; sealed at rest and never returned }
        status: { type: string, enum: [active, disabled], default: active }
    DeploymentTargetPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 3, maxLength: 64 }
        environment: { type: string, enum: [development, staging, production] }
        endpoint: { type: string, format: uri, description: http(s) URL without userinfo, query or fragment }
        healthPath: { type: string, maxLength: 256 }
        deployPath: { type: string, maxLength: 256 }
        secret: { type: string, writeOnly: true, maxLength: 4096, description: Omit to keep, empty string to clear, non-empty to replace }
        status: { type: string, enum: [active, disabled] }
    DeploymentTargetCheck:
      type: object
      additionalProperties: false
      required: [ok, statusCode, latencyMs, detail, checkedAt]
      properties:
        ok: { type: boolean }
        statusCode: { type: integer, minimum: 0, description: 0 when no HTTP response was received }
        latencyMs: { type: integer, format: int64, minimum: 0 }
        detail: { type: string, description: "ok, http <code>, timeout or a sanitized network error; never the secret" }
        checkedAt: { type: integer, format: int64, description: Unix seconds }
    DeploymentTargetPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeploymentTarget' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    Deployment:
      type: object
      additionalProperties: false
      required: [id, projectId, targetId, targetName, targetEndpoint, targetEnvironment, deploymentNumber, status, version, buildId, rollbackOf, approvalId, reviewId, triggeredBy, detail, createdAt, startedAt, finishedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        targetId: { type: string }
        targetName: { type: string, description: Target name snapshot at trigger time }
        targetEndpoint: { type: string, description: Target endpoint snapshot at trigger time }
        targetEnvironment: { type: string, description: Target environment snapshot at trigger time }
        deploymentNumber: { type: integer, format: int64, minimum: 1, description: Per-project monotonic sequence }
        status: { type: string, enum: [queued, awaiting_approval, running, succeeded, failed, cancelled, interrupted, rejected], description: awaiting_approval means a pending approval blocks execution; rejected is terminal and set by a rejection or approval expiry }
        version: { type: string }
        buildId: { type: string, description: Optional succeeded build snapshot; empty when not linked }
        rollbackOf: { type: string, description: Source deployment id when this is a rollback; empty otherwise }
        approvalId: { type: string, description: Approval request id when the target environment required approval; empty otherwise }
        reviewId: { type: string, description: Approved review snapshot when the deployment was gated on a review; empty when the review gate was disabled and no review was supplied }
        triggeredBy: { type: string, description: Actor id snapshot }
        detail: { type: string, description: "Terminal outcome such as http <code>, timeout or a sanitized network error; never a secret" }
        createdAt: { type: integer, format: int64, description: Unix seconds }
        startedAt: { type: integer, format: int64, description: Unix seconds; 0 while queued }
        finishedAt: { type: integer, format: int64, description: Unix seconds; 0 while unfinished }
    DeploymentPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Deployment' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    DeploymentEvent:
      type: object
      additionalProperties: false
      required: [id, deploymentId, stream, message, createdAt]
      properties:
        id: { type: integer, format: int64, description: Monotonic event id; the cursor for paging }
        deploymentId: { type: string }
        stream: { type: string, enum: [system, response] }
        message: { type: string, description: At most 4096 bytes per response line; lifecycle system lines are not capped by the response limit }
        createdAt: { type: integer, format: int64, description: Unix seconds }
    DeploymentEventPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeploymentEvent' }
    CreateDeploymentInput:
      type: object
      additionalProperties: false
      required: [targetId, version]
      properties:
        targetId: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
        version: { type: string, pattern: '^[A-Za-z0-9._+-]{1,64}$' }
        buildId: { type: string, description: Optional; must be a succeeded build of the same project }
        reviewId: { type: string, description: 'Optional unless the target environment is in AEGIS_DEPLOY_REQUIRE_REVIEW_ENVIRONMENTS; must reference an approved review of the same project. Recorded as the deployment review snapshot.' }
    RollbackDeploymentInput:
      type: object
      additionalProperties: false
      description: Optional reviewId; the version to restore is the most recent earlier succeeded version of the same project and target.
      properties:
        reviewId: { type: string, description: 'Optional unless the target environment is in AEGIS_DEPLOY_REQUIRE_REVIEW_ENVIRONMENTS; must reference an approved review of the same project. Recorded as the rollback deployment review snapshot.' }
    Approval:
      type: object
      additionalProperties: false
      required: [id, deploymentId, projectId, status, requestedBy, decidedBy, reason, createdAt, expiresAt, decidedAt]
      properties:
        id: { type: string }
        deploymentId: { type: string }
        projectId: { type: string }
        status: { type: string, enum: [pending, approved, rejected, expired], description: expired covers both the TTL scan and a deployment cancelled while awaiting approval }
        requestedBy: { type: string, description: Actor id that requested the deployment }
        decidedBy: { type: string, description: Admin actor id for approve/reject; empty for expiry }
        reason: { type: string, description: 'Optional rejection reason, "approval expired" or "deployment cancelled"; never a secret' }
        createdAt: { type: integer, format: int64, description: Unix seconds }
        expiresAt: { type: integer, format: int64, description: Unix seconds; createdAt + AEGIS_APPROVAL_TTL }
        decidedAt: { type: integer, format: int64, description: Unix seconds; 0 while pending }
    ApprovalPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Approval' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    RejectApprovalInput:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 512, description: 'Optional, trimmed, single line, no control characters; included in the audit detail' }
    Review:
      type: object
      additionalProperties: false
      required: [id, projectId, number, subject, description, version, externalUrl, status, requestedBy, requestedByName, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        number: { type: integer, format: int64, minimum: 1, description: Per-project monotonic sequence allocated under the project row lock }
        subject: { type: string, description: 3-200 UTF-8 bytes on one line; trimmed }
        description: { type: string, description: At most 2000 UTF-8 bytes }
        version: { type: string, description: 'At most 64 UTF-8 bytes on one line; trimmed; empty allowed' }
        externalUrl: { type: string, description: 'Empty when the request omitted it; otherwise an absolute http(s) review link without userinfo or fragment, at most 2048 UTF-8 bytes; display-only and never fetched' }
        status: { type: string, enum: [pending, approved, rejected, cancelled], description: pending -> approved/rejected/cancelled; terminal statuses never change again }
        requestedBy: { type: string, description: Actor id of the requester }
        requestedByName: { type: string, description: Requesting username resolved from the account }
        decidedBy: { type: string, description: Deciding (or cancelling) actor id; absent while pending }
        decidedByName: { type: string, description: Deciding (or cancelling) username; absent while pending }
        decidedAt: { type: integer, format: int64, description: Unix seconds of the decision or cancellation; absent while pending }
        reason: { type: string, description: Optional approve reason or required reject reason; absent when the decision carried none }
        createdAt: { type: integer, format: int64, description: Unix seconds }
        updatedAt: { type: integer, format: int64, description: Unix seconds }
    ReviewPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    CreateReviewInput:
      type: object
      additionalProperties: false
      required: [subject]
      properties:
        subject: { type: string, maxLength: 200, description: Required; 3-200 UTF-8 bytes on one line; trimmed before validation }
        description: { type: string, maxLength: 2000, description: Optional; at most 2000 UTF-8 bytes }
        version: { type: string, maxLength: 64, description: Optional; at most 64 UTF-8 bytes on one line; trimmed before validation }
        externalUrl: { type: string, maxLength: 2048, description: 'Optional absolute http(s) URL without userinfo or fragment, at most 2048 UTF-8 bytes; empty means absent' }
    ApproveReviewInput:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 512, description: 'Optional; trimmed; at most 512 UTF-8 bytes on one line; no control characters; stored and included in the audit detail when present' }
    RejectReviewInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 512, description: 'Required; trimmed; at most 512 UTF-8 bytes on one line; no control characters; stored and included in the audit detail' }
    ReviewExternalResult:
      type: object
      additionalProperties: false
      required: [id, reviewId, deliveryId, source, verdict, summary, url, receivedAt]
      properties:
        id: { type: string }
        reviewId: { type: string }
        deliveryId: { type: string, description: Sender delivery id; globally unique and the idempotency key for retries }
        source: { type: string, description: 'External tool name: 1-64 UTF-8 bytes on one line, trimmed' }
        verdict: { type: string, enum: [passed, failed, warning] }
        summary: { type: string, description: 'At most 500 UTF-8 bytes; newlines preserved, other control characters removed; empty when the delivery carried no note' }
        url: { type: string, description: 'Empty when absent; otherwise an absolute http(s) URL without userinfo or fragment, at most 2048 UTF-8 bytes; display-only and never fetched' }
        receivedAt: { type: integer, format: int64, description: Unix seconds when the server accepted the result }
    ReviewExternalResultList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          description: Newest first (receivedAt descending)
          items: { $ref: '#/components/schemas/ReviewExternalResult' }
    CreateReviewExternalResultInput:
      type: object
      additionalProperties: false
      required: [source, verdict]
      properties:
        source: { type: string, minLength: 1, maxLength: 64, description: Required external tool name; at most 64 UTF-8 bytes on one line, trimmed before validation }
        verdict: { type: string, enum: [passed, failed, warning] }
        summary: { type: string, maxLength: 500, description: Optional; at most 500 UTF-8 bytes; newlines preserved, other control characters removed }
        url: { type: string, maxLength: 2048, description: 'Optional absolute http(s) URL without userinfo or fragment; display-only, never fetched' }
    Scan:
      type: object
      additionalProperties: false
      required: [id, projectId, projectName, source, tool, version, verdict, summary, receivedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        projectName: { type: string, description: Project name resolved from the project registry for display }
        source: { type: string, description: 'External tool name: 1-64 UTF-8 bytes on one line, trimmed' }
        tool: { type: string, description: 'Optional tool name: at most 64 UTF-8 bytes on one line, trimmed; empty when omitted' }
        version: { type: string, description: 'Optional tool version: at most 64 UTF-8 bytes on one line, trimmed; empty when omitted' }
        verdict: { type: string, enum: [passed, failed, warning] }
        summary: { type: string, description: 'At most 1000 UTF-8 bytes; newlines preserved, other control characters removed; empty when the delivery carried no note' }
        reportUrl: { type: string, description: 'Absent when omitted; otherwise an absolute http(s) URL without userinfo or fragment, at most 2048 UTF-8 bytes; display-only and never fetched' }
        receivedAt: { type: integer, format: int64, description: Unix seconds when the server accepted the delivery }
    ScanPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Scan' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    CreateScanInput:
      type: object
      additionalProperties: false
      required: [source, verdict]
      properties:
        source: { type: string, minLength: 1, maxLength: 64, description: Required external tool name; at most 64 UTF-8 bytes on one line, trimmed before validation }
        tool: { type: string, maxLength: 64, description: 'Optional tool name; at most 64 UTF-8 bytes on one line, trimmed before validation' }
        version: { type: string, maxLength: 64, description: 'Optional tool version; at most 64 UTF-8 bytes on one line, trimmed before validation' }
        verdict: { type: string, enum: [passed, failed, warning] }
        summary: { type: string, maxLength: 1000, description: 'Optional; at most 1000 UTF-8 bytes; newlines preserved, other control characters removed' }
        reportUrl: { type: string, maxLength: 2048, description: 'Optional absolute http(s) URL without userinfo or fragment; display-only, never fetched' }
    SecurityEvent:
      type: object
      additionalProperties: false
      required: [id, source, severity, eventType, summary, status, occurredAt, receivedAt]
      properties:
        id: { type: string }
        source: { type: string, description: 'External detection source: 1-64 UTF-8 bytes on one line, trimmed' }
        severity: { type: string, enum: [low, medium, high, critical] }
        eventType: { type: string, description: 'Event type: 1-64 UTF-8 bytes on one line, trimmed' }
        summary: { type: string, description: 'At most 1000 UTF-8 bytes; newlines preserved, other control characters removed' }
        status: { type: string, enum: [open, acknowledged], description: open -> acknowledged; acknowledged events never change again }
        detailsUrl: { type: string, description: 'Absent when omitted; otherwise an absolute http(s) URL without userinfo or fragment, at most 2048 UTF-8 bytes; display-only and never fetched' }
        occurredAt: { type: integer, format: int64, description: Unix seconds when the source observed the event; defaults to receivedAt when the delivery omitted it }
        receivedAt: { type: integer, format: int64, description: Unix seconds when the server accepted the delivery }
        acknowledgedBy: { type: string, description: Admin actor id; absent while open }
        acknowledgedByName: { type: string, description: Acknowledging admin username; absent while open }
        acknowledgedAt: { type: integer, format: int64, description: Unix seconds of the acknowledgement; absent while open }
    SecurityEventPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SecurityEvent' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    CreateSecurityEventInput:
      type: object
      additionalProperties: false
      required: [source, severity, eventType, summary]
      properties:
        source: { type: string, minLength: 1, maxLength: 64, description: Required external source name; at most 64 UTF-8 bytes on one line, trimmed before validation }
        severity: { type: string, enum: [low, medium, high, critical] }
        eventType: { type: string, minLength: 1, maxLength: 64, description: Required event type; at most 64 UTF-8 bytes on one line, trimmed before validation }
        summary: { type: string, minLength: 1, maxLength: 1000, description: 'Required; 1-1000 UTF-8 bytes; newlines preserved, other control characters removed' }
        occurredAt: { type: integer, format: int64, description: 'Optional Unix seconds; defaults to now, must not be more than 300 seconds in the future' }
        detailsUrl: { type: string, maxLength: 2048, description: 'Optional absolute http(s) URL without userinfo or fragment; display-only, never fetched' }
    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, createdAt, actorId, actorUsername, action, objectType, objectId, result, detail, requestId]
      properties:
        id: { type: string }
        createdAt: { type: integer, format: int64, description: Unix seconds }
        actorId: { type: string, description: Empty for system rows }
        actorUsername: { type: string }
        action: { type: string, enum: [auth.login, user.create, user.password_change, user.password_reset, user.disable, user.enable, user.role_change, session.revoke, session.revoke_all, project.create, project.update, project.archive, project.unarchive, project.member_add, project.member_update, project.member_remove, build.trigger, build.cancel, build.retry, deployment_target.create, deployment_target.update, deployment_target.remove, deployment_target.check, deployment.create, deployment.cancel, deployment.rollback, approval.request, approval.approve, approval.reject, approval.expire, review.request, review.approve, review.reject, review.cancel, security_event.ack] }
        objectType: { type: string, enum: [user, session, project, build, deployment_target, deployment, approval, review, security_event] }
        objectId: { type: string }
        result: { type: string, enum: [success, failure] }
        detail: { type: string, description: Safe context such as role transitions or revoked counts; never secrets }
        requestId: { type: string, description: Links to the structured request log }
    AuditPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, requestId]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, validation_failed, unauthorized, forbidden, account_disabled, origin_denied, conflict, unsupported_media_type, rate_limited, not_found, not_ready, dependencies_unavailable, internal_error]
            message: { type: string, description: Human-readable safe detail; clients should branch on code/status }
        requestId: { $ref: '#/components/schemas/RequestID' }
  responses:
    Tokens:
      description: Access token and public user only; refresh secret is Set-Cookie only
      headers:
        Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, requestId]
            properties:
              data: { $ref: '#/components/schemas/TokenData' }
              requestId: { $ref: '#/components/schemas/RequestID' }
    User:
      description: Public user
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, requestId]
            properties:
              data: { $ref: '#/components/schemas/User' }
              requestId: { $ref: '#/components/schemas/RequestID' }
    BadRequest:
      description: Invalid JSON, unknown field, non-object or >16 KiB (invalid_request), or invalid user fields or a deployment review gate rejection (validation_failed)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Invalid credentials or missing/invalid/expired/revoked Bearer/session; error.code is unauthorized
      headers:
        WWW-Authenticate: { $ref: '#/components/headers/BearerChallenge' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Missing/disallowed auth Origin or cross-site request (origin_denied), non-admin user (forbidden), or disabled account login (account_disabled)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Unknown resource id; error.code is not_found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Conflicting state; error.code is conflict (terminal deployment, duplicate target name, or a target with deployment history)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnsupportedMediaType:
      description: Missing/wrong Content-Type (application/json required); error.code is unsupported_media_type
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: Internal error; error.code is internal_error, no sensitive implementation details
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

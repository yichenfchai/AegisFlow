    post:
      tags: [DeploymentTargets]
      operationId: createDeploymentTarget
      summary: Create a deployment target (admin only)
      description: |
        kind defaults to http, environment to development, healthPath to /,
        deployPath to /deploy and status to active. A supplied secret is sealed
        with AES-256-GCM (AAD bound to the target id) and is never returned;
        hasSecret only reports its presence. Supplying a secret without
        AEGIS_SECRET_KEY returns 400. The create writes a
        deployment_target.create audit row in the same transaction.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeploymentTargetInput' }
      responses:
        '201':
          description: Deployment target created in the active state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/DeploymentTarget' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Target name already exists case-insensitively; error.code is conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/deployment-targets/{targetId}:
    get:
      tags: [DeploymentTargets]
      operationId: getDeploymentTarget
      summary: Get one deployment target (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: targetId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      responses:
        '200':
          description: Deployment target
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/DeploymentTarget' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [DeploymentTargets]
      operationId: updateDeploymentTarget
      summary: Update a deployment target (admin only)
      description: |
        At least one field is required. Omitted fields are unchanged. secret
        has three states: omitted keeps the stored secret, an empty string
        clears it, a non-empty value replaces it. Every accepted update writes
        a deployment_target.update audit row in the same transaction.
      security:
        - bearerAuth: []
      parameters:
        - name: targetId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeploymentTargetPatch' }
      responses:
        '200':
          description: Updated deployment target (or the unchanged target for a no-op patch)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/DeploymentTarget' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Renaming to an existing name; error.code is conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [DeploymentTargets]
      operationId: removeDeploymentTarget
      summary: Delete a deployment target (admin only)
      description: |
        Hard delete. A target referenced by deployment history returns 409 so
        the recorded snapshots stay explainable. The delete writes a
        deployment_target.remove audit row in the same transaction.
      security:
        - bearerAuth: []
      parameters:
        - name: targetId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      responses:
        '200':
          description: Deployment target removed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [removed]
                    properties:
                      removed: { type: boolean, enum: [true] }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/deployment-targets/{targetId}/check:
    post:
      tags: [DeploymentTargets]
      operationId: checkDeploymentTarget
      summary: Probe connectivity (admin only)
      description: |
        Sends GET endpoint + healthPath with a bounded timeout
        (AEGIS_DEPLOY_CHECK_TIMEOUT, default 5s, max 1m). A stored secret is
        decrypted for this request only and sent as Authorization: Bearer. 2xx
        is healthy; any other outcome records lastCheckAt/lastCheckOk/
        lastCheckDetail and writes a deployment_target.check audit row in the
        same transaction. The response never contains the secret.
      security:
        - bearerAuth: []
      parameters:
        - name: targetId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody: { $ref: '#/components/requestBodies/EmptyObject' }
      responses:
        '200':
          description: Probe outcome (ok=true for a 2xx response)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/DeploymentTargetCheck' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/{projectId}/deployments:
    get:
      tags: [Deployments]
      operationId: listProjectDeployments
      summary: List a project's deployments (visible projects)
      description: Newest first, restricted to projects the caller can see. A member with write access to the project can enqueue, cancel and roll back here.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - name: status
          in: query
          required: false
          description: Filter by deployment status; omit for all
          schema: { type: string, enum: [queued, awaiting_approval, running, succeeded, failed, cancelled, interrupted, rejected] }
      responses:
        '200':
          description: Deployment page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/DeploymentPage' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Deployments]
      operationId: createDeployment
      summary: Enqueue a deployment (project write access)
      description: |
        The target must exist and be active; its name, endpoint and environment
        are snapshotted into the new deployment. version is a tag, SHA or
        semantic version (1-64 chars of A-Z a-z 0-9 . _ + -). buildId is
        optional and must reference a succeeded build of the same project.
        deploymentNumber is allocated per project under the project row lock.
        reviewId is optional and records an approved review of the same project
        as the deployment's review snapshot. When the target environment is
        listed in AEGIS_DEPLOY_REQUIRE_REVIEW_ENVIRONMENTS (empty by default,
        which disables the gate) reviewId is required; a review that is
        unknown, belongs to another project or is not approved is 400
        validation_failed. The review gate is checked before the approval state
        machine, so the two gates compose.
        A single leased worker executes queued deployments. When the target
        environment is listed in AEGIS_DEPLOY_APPROVAL_ENVIRONMENTS (default
        production) the new deployment starts in awaiting_approval instead of
        queued; a pending approval is created in the same transaction, approvalId
        is set and approving moves it to queued. Every create writes a
        deployment.create audit row, and approval.request when approval is
        required, in the same transaction.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDeploymentInput' }
      responses:
        '201':
          description: Deployment created; status is queued, or awaiting_approval when the target environment requires approval
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Deployment' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/deployments:
    get:
      tags: [Deployments]
      operationId: listDeployments
      summary: List deployments across projects (visible projects)
      description: Newest first. projectId and status are optional filters; the list mirrors the global build list and is restricted to projects the caller can see.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - name: projectId
          in: query
          required: false
          description: Filter by project id; omit for all projects
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
        - name: status
          in: query
          required: false
          description: Filter by deployment status; omit for all
          schema: { type: string, enum: [queued, awaiting_approval, running, succeeded, failed, cancelled, interrupted, rejected] }
      responses:
        '200':
          description: Deployment page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/DeploymentPage' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/deployments/{deploymentId}:
    get:
      tags: [Deployments]
      operationId: getDeployment
      summary: Get one deployment (visible projects)
      security:
        - bearerAuth: []
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      responses:
        '200':
          description: Deployment with target snapshot and terminal detail
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Deployment' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/deployments/{deploymentId}/events:
    get:
      tags: [Deployments]
      operationId: listDeploymentEvents
      summary: Read deployment events by cursor (visible projects)
      description: Oldest first. after is the exclusive event id (the same cursor the SSE-style readers use); limit is 1-1000 and defaults to 200.
      security:
        - bearerAuth: []
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
        - name: after
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: Deployment events after the cursor
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/DeploymentEventPage' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/deployments/{deploymentId}/cancel:
    post:
      tags: [Deployments]
      operationId: cancelDeployment
      summary: Cancel a queued, awaiting-approval or running deployment (project write access)
      description: |
        Cancelling a running deployment aborts the in-flight HTTP request via a
        300ms status watchdog. Repeating on an already-cancelled deployment is
        idempotent and writes no second audit row; terminal deployments are 409.
        deployment.cancel is audited in the same transaction.
      security:
        - bearerAuth: []
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody: { $ref: '#/components/requestBodies/EmptyObject' }
      responses:
        '200':
          description: Cancelled (or already cancelled) deployment
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Deployment' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/deployments/{deploymentId}/rollback:
    post:
      tags: [Deployments]
      operationId: rollbackDeployment
      summary: Roll back to the most recent earlier succeeded version (project write access)
      description: |
        The source must be succeeded or failed (409 otherwise), and an earlier
        succeeded deployment for the same project and target must exist (400
        otherwise). A new deployment is created (queued, or awaiting_approval
        when the target environment requires approval) with rollbackOf set to
        the source id and version set to the version being restored; the source
        row is unchanged. reviewId follows the same review gate as a fresh
        deployment: it is required when the target environment is in
        AEGIS_DEPLOY_REQUIRE_REVIEW_ENVIRONMENTS and must always reference an
        approved review of the same project (400 validation_failed otherwise).
        Repeated rollbacks create multiple rows: deployment is not idempotent,
        and the audit trail records each attempt.
      security:
        - bearerAuth: []
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RollbackDeploymentInput' }
      responses:
        '201':
          description: Rollback deployment created; status is queued, or awaiting_approval when the target environment requires approval
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Deployment' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/approvals:
    get:
      tags: [Approvals]
      operationId: listApprovals
      summary: List deployment approvals (admin only)
      description: Newest first. Every approval endpoint is admin-only.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - name: status
          in: query
          required: false
          description: Filter by approval status; omit for all
          schema: { type: string, enum: [pending, approved, rejected, expired] }
      responses:
        '200':
          description: Approval page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]

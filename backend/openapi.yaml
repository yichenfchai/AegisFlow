openapi: 3.0.3
info:
  title: AegisFlow Browser Authentication API
  version: 1.0.0
  description: |
    Multi-instance PostgreSQL backend with Redis shared rate limiting behind a same-origin reverse proxy (recommended).
    All JSON responses use data/error plus requestId envelopes. All responses include
    X-Request-ID and Cache-Control: no-store. POST bodies must be one JSON object,
    Content-Type application/json, <=16 KiB, with no unknown properties. An empty
    object {} is mandatory for refresh/logout; JSON refreshToken is never accepted
    or returned. Optional fields must have their documented type when present.

    Every /api/v1/auth POST, including login, requires exactly one Origin header
    exactly matching AEGIS_ALLOWED_ORIGINS (scheme, host, port; no trailing slash).
    Missing/disallowed Origin and Sec-Fetch-Site: cross-site return 403 before any
    mutation. This applies to same-origin clients and non-browser scripts as well.
    Origin null is not allowed. Any supplied Origin on other routes must also be
    allowlisted. CORS reflects the allowed Origin, enables credentials, and varies
    on Origin and Sec-Fetch-Site. OPTIONS returns 204 with GET, POST, OPTIONS and
    Authorization, Content-Type allowed; its Vary also covers request method/headers.

    Login/refresh set a host-only aegis_refresh cookie, Path=/api/v1/auth, HttpOnly,
    SameSite=Strict. Secure is explicitly AEGIS_COOKIE_SECURE (default false locally;
    set true for production HTTPS), not inferred from forwarding headers. remember
    defaults false (session cookie, no Max-Age/Expires). true adds Max-Age and Expires
    up to the absolute session deadline. Rotation preserves remember/deadline and
    replaces the cookie, never extends the session. Default absolute lifetime 720h;
    default access lifetime 15m (expiresIn is seconds, capped by session deadline).
    A browser may restore session cookies after restart; closing it does not reliably
    log out. Logout must be used for immediate revocation. Access tokens are Bearer
    only, validated against PostgreSQL session state; cookies never authorize me/users.
    Keep access tokens in memory, do not store refresh tokens in JavaScript storage.
    Serialize refresh calls: replay of a consumed token revokes the whole session.
servers:
  - url: /
    description: Same-origin proxy; use relative /api/v1 URLs in the browser
security: []
tags:
  - name: Auth
    description: Browser Cookie session lifecycle and Bearer identity
  - name: Users
    description: Administrator-only local user management
  - name: Projects
    description: Project registry with global-role authorization
  - name: Builds
    description: Build pipeline (trigger, list, detail, logs, cancel)
  - name: DeploymentTargets
    description: Admin-only deployment targets with encrypted credentials and connectivity probes
  - name: Deployments
    description: Admin-only deployment tasks, lifecycle events, cancellation and rollback
  - name: Approvals
    description: Admin-only deployment approval queue (approve, reject, expiry)
  - name: Audit
    description: Persistent authentication and account-management audit trail
  - name: Health
    description: Process liveness and database readiness
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: health
      summary: Process liveness (no database check)
      responses:
        '200':
          description: Process is alive
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [status]
                    properties:
                      status: { type: string, enum: [ok] }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /readyz:
    get:
      tags: [Health]
      operationId: readiness
      summary: PostgreSQL and Redis readiness with a two-second timeout
      responses:
        '200':
          description: Database is ready
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [status]
                    properties:
                      status: { type: string, enum: [ready] }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: PostgreSQL or Redis unavailable; error.code is not_ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate credentials and set refresh cookie
      description: Username lookup is case-insensitive. All attempts count toward the Redis shared IP limit (10/minute across instances). Only configured trusted proxy CIDRs may supply X-Forwarded-For. Redis failure returns 503 without local fallback. Invalid credentials return the same 401. A correct password for a disabled account returns 403 account_disabled (state is never revealed without password knowledge). No public registration.
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429':
          description: Login rate limit exceeded; error.code is rate_limited
          headers:
            Retry-After:
              description: Retry delay in seconds
              schema: { type: string, pattern: '^[1-9][0-9]*$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: Shared limiter unavailable; error.code is dependencies_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: Rotate refresh cookie and return a new access token
      description: |
        Requires the cookie, not a Bearer token. Unknown/expired/revoked/replayed or
        missing cookie returns 401 and deletes the cookie. Replay also revokes the
        entire session including outstanding access tokens. Malformed body/CSRF
        failures do not rotate or revoke. No JSON refresh credential fallback.
      security:
        - refreshCookie: []
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
      requestBody: { $ref: '#/components/requestBodies/EmptyObject' }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Missing or invalid refresh session; deletes aegis_refresh cookie
          headers:
            Set-Cookie: { $ref: '#/components/headers/DeletedRefreshCookie' }
            WWW-Authenticate: { $ref: '#/components/headers/BearerChallenge' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session and delete the refresh cookie
      description: |
        Idempotent. With a known refresh cookie (even a historical rotated value),
        revokes the whole session immediately. Missing, unknown or already revoked
        cookie still returns 200 and deletion Set-Cookie. A missing cookie cannot
        identify/revoke another session. Storage failure returns 500 without deleting
        the cookie, allowing retry. No Bearer required. JSON body must be {}.
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
      requestBody: { $ref: '#/components/requestBodies/EmptyObject' }
      responses:
        '200':
          description: Logged out, including an already absent session
          headers:
            Set-Cookie: { $ref: '#/components/headers/DeletedRefreshCookie' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [loggedOut]
                    properties:
                      loggedOut: { type: boolean, enum: [true] }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: currentUser
      summary: Return the current database-backed user and role
      security:
        - bearerAuth: []
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change the caller's own password
      description: |
        Verifies currentPassword against the stored bcrypt hash. On success the
        hash is replaced and every session except the caller's current session
        is revoked; the current session stays usable and is audited. Wrong
        current password returns 401 and is recorded as a failure audit row.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordInput' }
      responses:
        '200':
          description: Password changed; other sessions revoked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [changed]
                    properties:
                      changed: { type: boolean, enum: [true] }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/sessions:
    get:
      tags: [Auth]
      operationId: listSessions
      summary: List the caller's active sessions
      description: Active (non-revoked, unexpired) sessions with the current one marked. Token hashes are never exposed.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessions, newest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SessionInfo' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Auth]
      operationId: revokeOtherSessions
      summary: Revoke all of the caller's sessions except the current one
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Count of revoked sessions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [revoked]
                    properties:
                      revoked: { type: integer, minimum: 0 }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      operationId: revokeSession
      summary: Revoke one of the caller's own sessions
      description: Unknown or foreign session ids return 404. Revoking an already-revoked own session is an idempotent 200.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      responses:
        '200':
          description: Session revoked (or already inactive)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [revoked]
                    properties:
                      revoked: { type: boolean, enum: [true] }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users (admin only)
      description: Ordered by username case-insensitively, then id; empty list is []. Password hashes are never included.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Users page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/UserPage' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a local user (admin only)
      description: Only a Bearer token grants access; no cookie authorization. displayName defaults to username when omitted or empty. No self-service registration.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserInput' }
      responses:
        '201': { $ref: '#/components/responses/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Username already exists (case-insensitive); error.code is conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/users/{userId}:
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Change role or disabled state (admin only)
      description: |
        At least one of role or disabled is required. Disabling revokes all of
        the target's sessions immediately; the disabled state is only revealed
        by login after a correct password. Role changes apply to existing
        sessions immediately because roles are read live per request. Disabling
        or demoting the last enabled administrator returns 400. No-op updates
        (same role, same state) return 200 without an audit row. Both fields
        may be supplied; role is applied first.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserInput' }
      responses:
        '200':
          description: Updated (or already in the requested state)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [updated]
                    properties:
                      updated: { type: boolean, enum: [true] }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/users/{userId}/password-reset:
    post:
      tags: [Users]
      operationId: resetPassword
      summary: Set a new password for any user (admin only)
      description: Replaces the password and revokes every session of the target user, including the caller's own sessions when targeting self.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordInput' }
      responses:
        '200':
          description: Password reset; target sessions revoked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [reset]
                    properties:
                      reset: { type: boolean, enum: [true] }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/audit:
    get:
      tags: [Audit]
      operationId: listAudit
      summary: Query the persistent audit trail (admin only)
      description: |
        Newest first. Records actor, action, object, result, detail and the
        X-Request-ID of audited operations: login success, user create,
        password change (including wrong-current-password failures), password
        reset, disable/enable, role change, session revocation, plus project
        and build mutations. Failed logins are rate-limited and stay in
        structured logs only. Optional filters narrow both the returned page
        and the total and combine with AND; from/to accept an RFC3339 timestamp
        or a YYYY-MM-DD date (a date-only to includes that whole UTC day). Rows
        older than AEGIS_AUDIT_RETENTION are purged hourly when the operator
        sets it; the default keeps every row.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - name: action
          in: query
          required: false
          description: Exact action name, e.g. user.create or build.trigger
          schema: { type: string, maxLength: 128 }
        - name: objectType
          in: query
          required: false
          description: Exact object type, e.g. user, project or build
          schema: { type: string, maxLength: 128 }
        - name: result
          in: query
          required: false
          description: Filter by audit result
          schema: { type: string, enum: [success, failure] }
        - name: actor
          in: query
          required: false
          description: Actor id or username; the username match is case-insensitive
          schema: { type: string, maxLength: 128 }
        - name: from
          in: query
          required: false
          description: Inclusive lower bound (RFC3339 or YYYY-MM-DD)
          schema: { type: string, maxLength: 40 }
        - name: to
          in: query
          required: false
          description: Inclusive upper bound (RFC3339 or YYYY-MM-DD, date-only means end of that UTC day)
          schema: { type: string, maxLength: 40 }
      responses:
        '200':
          description: Audit page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/AuditPage' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects (all roles)
      description: Ordered by name case-insensitively, then id. Only projects the caller can see are listed; global admins see every project, every other role sees public projects plus the ones it created or joined. A private project the caller cannot see is never listed and, by id, answers 404.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - name: status
          in: query
          required: false
          description: Filter by lifecycle status; omit for all
          schema: { type: string, enum: [active, archived] }
      responses:
        '200':
          description: Projects page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/ProjectPage' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project (admin or member)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201':
          description: Project created in the active state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Project' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Project name already exists case-insensitively; error.code is conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/{projectId}:
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get one project (all roles)
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Project' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Update fields or archive/restore (admin, or a member with write access)
      description: |
        At least one field is required. Names stay unique case-insensitively.
        Archived projects are read-only except for archived:false (restore);
        repeating the archive is an idempotent no-op. Archive and field edits
        each write one audit row in the same transaction.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectPatch' }
      responses:
        '200':
          description: Updated project (or unchanged for a no-op patch)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Project' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Duplicate name, or editing an archived project; error.code is conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/{projectId}/builds:
    post:
      tags: [Builds]
      operationId: triggerBuild
      summary: Enqueue a build for the project (admin or member)
      description: |
        The project must be active and have a buildCommand configured. The
        build number is a per-project monotonic sequence; branch defaults to
        the project defaultBranch. Execution starts in-process (single worker,
        SKIP LOCKED claiming); a restart marks running builds interrupted.
        A successful trigger writes a build.trigger audit entry (objectType
        build) in the same transaction as the build row.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                branch:
                  type: string
                  maxLength: 128
                  description: Optional branch snapshot; defaults to the project defaultBranch
      responses:
        '201':
          description: Build enqueued
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Build' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400':
          description: Project has no build command, or invalid branch (validation_failed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Archived project cannot start builds; error.code is conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/{projectId}/members:
    get:
      tags: [Projects]
      operationId: listProjectMembers
      summary: List project members (anyone who can see the project)
      description: |
        Maintainers first, then by username. An invisible project answers 404,
        so a private project's member list cannot be probed.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      responses:
        '200':
          description: Members, maintainers first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectMember' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Projects]
      operationId: addProjectMember
      summary: Add a project member (admin or member)
      description: |
        The target account must exist. Membership is a read grant: it never
        raises the caller's global role, and a private project is invisible
        until a row exists for the caller.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectMemberInput' }
      responses:
        '201':
          description: Membership created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/ProjectMember' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: User is already a member of this project; error.code is conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/{projectId}/members/{userId}:
    patch:
      tags: [Projects]
      operationId: updateProjectMember
      summary: Change one membership role (admin or member)
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
        - name: userId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectMemberPatch' }
      responses:
        '200':
          description: Updated membership
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/ProjectMember' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Projects]
      operationId: removeProjectMember
      summary: Remove one membership (admin or member)
      description: The project creator keeps owner access and cannot be removed (400).
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
        - name: userId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      responses:
        '200':
          description: Membership removed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [removed]
                    properties:
                      removed: { type: boolean }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/builds:
    get:
      tags: [Builds]
      operationId: listBuilds
      summary: List builds newest first (all roles)
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - name: projectId
          in: query
          required: false
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      responses:
        '200':
          description: Builds page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/BuildPage' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/builds/{buildId}:
    get:
      tags: [Builds]
      operationId: getBuild
      summary: Build detail (all roles)
      security:
        - bearerAuth: []
      parameters:
        - name: buildId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      responses:
        '200':
          description: Build
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Build' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/builds/{buildId}/logs:
    get:
      tags: [Builds]
      operationId: getBuildLogs
      summary: Build log events after a cursor (all roles)
      description: |
        Polling endpoint retained as the fallback for SSE clients. The cursor
        `after` is the last event id the client saw. Output is capped
        server-side (line length and total events) with a system line marking
        truncation.
      security:
        - bearerAuth: []
      parameters:
        - name: buildId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
        - name: after
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: Log events, oldest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LogEvent' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/builds/{buildId}/events:
    get:
      tags: [Builds]
      operationId: streamBuildEvents
      summary: Stream build logs and status as Server-Sent Events (all roles)
      description: |
        Long-lived `text/event-stream` response. Frames: `event: status` with a
        Build payload on connect and on every status change; `event: logs` with
        a JSON array of LogEvent whose last id is the resume cursor; `event:
        done` with `{"reason":"terminal"}` once a finished build's output has
        settled, or `{"reason":"reconnect"}` when the connection lifetime cap
        is reached. Comment frames (`: ping`) keep intermediaries open. Resume
        with `Last-Event-ID` (or `?after=`). Clients must send the bearer token
        on a streaming request; RBAC matches the polling logs endpoint.
      security:
        - bearerAuth: []
      parameters:
        - name: buildId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
        - name: after
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Server-Sent Events stream (status, logs, done, ping comments)
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/builds/{buildId}/cancel:
    post:
      tags: [Builds]
      operationId: cancelBuild
      summary: Cancel a queued or running build (admin or member)
      description: The executing worker terminates the process within its watchdog interval. Repeating on an already-cancelled build is an idempotent 200; terminal builds return 409. A successful state change writes a build.cancel audit entry (objectType build) in the same transaction; an idempotent repeat writes no second entry.
      security:
        - bearerAuth: []
      parameters:
        - name: buildId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody: { $ref: '#/components/requestBodies/EmptyObject' }
      responses:
        '200':
          description: Build cancelled (or already cancelled)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Build' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Build already finished; error.code is conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/builds/{buildId}/retry:
    post:
      tags: [Builds]
      operationId: retryBuild
      summary: Retry a terminal build (admin or member)
      description: |
        Enqueues a new build for the original build's branch, using the
        project's **current** buildCommand, so fixing the command and retrying
        builds the fix. The original build row stays as the historical record of
        what ran. The project must be active and still carry a build command;
        queued or running builds cannot be retried (409). A successful retry
        writes a build.retry audit entry (objectType build) whose detail names
        the original build number, in the same transaction as the new row.
      security:
        - bearerAuth: []
      parameters:
        - name: buildId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody: { $ref: '#/components/requestBodies/EmptyObject' }
      responses:
        '201':
          description: New build enqueued
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Build' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Build is still queued or running, the project is archived, or it has no build command; error.code is conflict or validation_failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/deployment-targets:
    get:
      tags: [DeploymentTargets]
      operationId: listDeploymentTargets
      summary: List deployment targets (admin only)
      description: Ordered by name case-insensitively, then id. Deployment targets are global administrative objects; members and viewers get 403 on every route in this group.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Deployment target page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/DeploymentTargetPage' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [DeploymentTargets]
      operationId: createDeploymentTarget
      summary: Create a deployment target (admin only)
      description: |
        kind defaults to http, environment to development, healthPath to /,
        deployPath to /deploy and status to active. A supplied secret is sealed
        with AES-256-GCM (AAD bound to the target id) and is never returned;
        hasSecret only reports its presence. Supplying a secret without
        AEGIS_SECRET_KEY returns 400. The create writes a
        deployment_target.create audit row in the same transaction.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeploymentTargetInput' }
      responses:
        '201':
          description: Deployment target created in the active state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/DeploymentTarget' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Target name already exists case-insensitively; error.code is conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/deployment-targets/{targetId}:
    get:
      tags: [DeploymentTargets]
      operationId: getDeploymentTarget
      summary: Get one deployment target (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: targetId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      responses:
        '200':
          description: Deployment target
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/DeploymentTarget' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [DeploymentTargets]
      operationId: updateDeploymentTarget
      summary: Update a deployment target (admin only)
      description: |
        At least one field is required. Omitted fields are unchanged. secret
        has three states: omitted keeps the stored secret, an empty string
        clears it, a non-empty value replaces it. Every accepted update writes
        a deployment_target.update audit row in the same transaction.
      security:
        - bearerAuth: []
      parameters:
        - name: targetId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeploymentTargetPatch' }
      responses:
        '200':
          description: Updated deployment target (or the unchanged target for a no-op patch)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/DeploymentTarget' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Renaming to an existing name; error.code is conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [DeploymentTargets]
      operationId: removeDeploymentTarget
      summary: Delete a deployment target (admin only)
      description: |
        Hard delete. A target referenced by deployment history returns 409 so
        the recorded snapshots stay explainable. The delete writes a
        deployment_target.remove audit row in the same transaction.
      security:
        - bearerAuth: []
      parameters:
        - name: targetId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      responses:
        '200':
          description: Deployment target removed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [removed]
                    properties:
                      removed: { type: boolean, enum: [true] }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/deployment-targets/{targetId}/check:
    post:
      tags: [DeploymentTargets]
      operationId: checkDeploymentTarget
      summary: Probe connectivity (admin only)
      description: |
        Sends GET endpoint + healthPath with a bounded timeout
        (AEGIS_DEPLOY_CHECK_TIMEOUT, default 5s, max 1m). A stored secret is
        decrypted for this request only and sent as Authorization: Bearer. 2xx
        is healthy; any other outcome records lastCheckAt/lastCheckOk/
        lastCheckDetail and writes a deployment_target.check audit row in the
        same transaction. The response never contains the secret.
      security:
        - bearerAuth: []
      parameters:
        - name: targetId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody: { $ref: '#/components/requestBodies/EmptyObject' }
      responses:
        '200':
          description: Probe outcome (ok=true for a 2xx response)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/DeploymentTargetCheck' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/{projectId}/deployments:
    get:
      tags: [Deployments]
      operationId: listProjectDeployments
      summary: List a project's deployments (admin only)
      description: Newest first. Every deployment endpoint is admin-only; the project path only scopes the list.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - name: status
          in: query
          required: false
          description: Filter by deployment status; omit for all
          schema: { type: string, enum: [queued, awaiting_approval, running, succeeded, failed, cancelled, interrupted, rejected] }
      responses:
        '200':
          description: Deployment page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/DeploymentPage' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Deployments]
      operationId: createDeployment
      summary: Enqueue a deployment (admin only)
      description: |
        The target must exist and be active; its name, endpoint and environment
        are snapshotted into the new deployment. version is a tag, SHA or
        semantic version (1-64 chars of A-Z a-z 0-9 . _ + -). buildId is
        optional and must reference a succeeded build of the same project.
        deploymentNumber is allocated per project under the project row lock.
        The deployment starts queued and a single leased worker executes it;
        when the target environment is in AEGIS_DEPLOY_APPROVAL_ENVIRONMENTS
        (default production) it instead starts awaiting_approval, a pending
        approval is created in the same transaction and approvalId is set.
        deployment.create (and approval.request when required) is audited in
        the same transaction.
        The deployment starts queued; a single leased worker executes it.
        deployment.create is audited in the same transaction. Approvals arrive
        with P4.3; this slice always enqueues directly.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDeploymentInput' }
      responses:
        '201':
          description: Deployment enqueued in the queued state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Deployment' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/deployments:
    get:
      tags: [Deployments]
      operationId: listDeployments
      summary: List deployments across projects (admin only)
      description: Newest first. projectId and status are optional filters; every deployment endpoint is admin-only and this list mirrors the global build list.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - name: projectId
          in: query
          required: false
          description: Filter by project id; omit for all projects
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
        - name: status
          in: query
          required: false
          description: Filter by deployment status; omit for all
          schema: { type: string, enum: [queued, awaiting_approval, running, succeeded, failed, cancelled, interrupted, rejected] }
      responses:
        '200':
          description: Deployment page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/DeploymentPage' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/deployments/{deploymentId}:
    get:
      tags: [Deployments]
      operationId: getDeployment
      summary: Get one deployment (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      responses:
        '200':
          description: Deployment with target snapshot and terminal detail
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Deployment' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/deployments/{deploymentId}/events:
    get:
      tags: [Deployments]
      operationId: listDeploymentEvents
      summary: Read deployment events by cursor (admin only)
      description: Oldest first. after is the exclusive event id (the same cursor the SSE-style readers use); limit is 1-1000 and defaults to 200.
      security:
        - bearerAuth: []
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
        - name: after
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: Deployment events after the cursor
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/DeploymentEventPage' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/deployments/{deploymentId}/cancel:
    post:
      tags: [Deployments]
      operationId: cancelDeployment
      summary: Cancel a queued, awaiting-approval or running deployment (admin only)
      description: |
        Cancelling a running deployment aborts the in-flight HTTP request via a
        300ms status watchdog. Repeating on an already-cancelled deployment is
        idempotent and writes no second audit row; terminal deployments are 409.
        deployment.cancel is audited in the same transaction.
      security:
        - bearerAuth: []
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody: { $ref: '#/components/requestBodies/EmptyObject' }
      responses:
        '200':
          description: Cancelled (or already cancelled) deployment
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Deployment' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/deployments/{deploymentId}/rollback:
    post:
      tags: [Deployments]
      operationId: rollbackDeployment
      summary: Roll back to the most recent earlier succeeded version (admin only)
      description: |
        The source must be succeeded or failed (409 otherwise), and an earlier
        succeeded deployment for the same project and target must exist (400
        otherwise). A new queued deployment is created with rollbackOf set to
        the source id and version set to the version being restored; the source
        row is unchanged. Repeated rollbacks create multiple rows: deployment is
        not idempotent, and the audit trail records each attempt.
      security:
        - bearerAuth: []
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RollbackDeploymentInput' }
      responses:
        '201':
          description: Rollback deployment enqueued
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Deployment' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/approvals:
    get:
      tags: [Approvals]
      operationId: listApprovals
      summary: List deployment approvals (admin only)
      description: Newest first. Every approval endpoint is admin-only.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - name: status
          in: query
          required: false
          description: Filter by approval status; omit for all
          schema: { type: string, enum: [pending, approved, rejected, expired] }
      responses:
        '200':
          description: Approval page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/ApprovalPage' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/approvals/{approvalId}/approve:
    post:
      tags: [Approvals]
      operationId: approveApproval
      summary: Approve a pending deployment approval (admin only)
      description: |
        Moves the approval from pending to approved and its deployment from
        awaiting_approval to queued (the worker is woken immediately), in one
        transaction with an approval.approve audit row. Repeating on an already
        approved approval is idempotent and writes no second audit row. A
        non-pending approval, or a deployment that is no longer awaiting
        approval (for example because it was cancelled), returns 409; the
        approval then stays pending until the expiry scan closes it.
      security:
        - bearerAuth: []
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody: { $ref: '#/components/requestBodies/EmptyObject' }
      responses:
        '200':
          description: Approved (or already approved) approval
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Approval' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/approvals/{approvalId}/reject:
    post:
      tags: [Approvals]
      operationId: rejectApproval
      summary: Reject a pending deployment approval (admin only)
      description: |
        Moves the approval from pending to rejected and its deployment from
        awaiting_approval to rejected, in one transaction with an
        approval.reject audit row. reason is optional, trimmed, at most 512
        bytes and single-line; when present it is stored and included in the
        audit detail. Repeating on an already rejected approval is idempotent
        and writes no second audit row. Any other non-pending status, or a
        deployment that is no longer awaiting approval, returns 409.
      security:
        - bearerAuth: []
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectApprovalInput' }
      responses:
        '200':
          description: Rejected (or already rejected) approval
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data: { $ref: '#/components/schemas/Approval' }
                  requestId: { $ref: '#/components/schemas/RequestID' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 access token, checked against a live PostgreSQL session and current user role
    refreshCookie:
      type: apiKey
      in: cookie
      name: aegis_refresh
      description: HttpOnly host-only cookie set/rotated by login/refresh; JavaScript must never read or set it
  parameters:
    AuthOrigin:
      name: Origin
      in: header
      required: true
      description: Exactly one browser Origin, matching AEGIS_ALLOWED_ORIGINS exactly; required on all auth POSTs even same-origin and scripts
      schema: { type: string, example: 'http://localhost:5173' }
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, default 20, between 1 and 100
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      required: false
      description: Zero-based page offset
      schema: { type: integer, minimum: 0, default: 0 }
  requestBodies:
    EmptyObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            maxProperties: 0
          example: {}
  headers:
    RequestID:
      description: Same value as the envelope requestId
      schema: { $ref: '#/components/schemas/RequestID' }
    BearerChallenge:
      schema: { type: string, enum: [Bearer] }
    RefreshCookie:
      description: |
        aegis_refresh=<opaque>; Path=/api/v1/auth; HttpOnly; SameSite=Strict;
        Secure only when explicitly configured. remember=true adds Max-Age and
        Expires bounded by the original absolute deadline. No Domain attribute.
      schema: { type: string }
    DeletedRefreshCookie:
      description: Empty aegis_refresh cookie with matching Path/HttpOnly/SameSite/Secure, Max-Age=0 and an expired Expires
      schema: { type: string }
  schemas:
    RequestID:
      type: string
      pattern: '^[a-f0-9]{32}$'
    User:
      type: object
      additionalProperties: false
      required: [id, username, displayName, role, disabled, createdAt]
      properties:
        id: { type: string }
        username: { $ref: '#/components/schemas/Username' }
        displayName:
          type: string
          description: Valid UTF-8, at most 256 bytes
        role: { type: string, enum: [admin, member, viewer] }
        disabled:
          type: boolean
          description: Disabled accounts cannot log in and have no active sessions
        createdAt:
          type: integer
          format: int64
          description: Unix seconds; 0 means unknown for rows created before the account-management migration
    Username:
      type: string
      minLength: 3
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{2,63}$'
      description: ASCII only; uniqueness and login lookup are case-insensitive
    Password:
      type: string
      format: password
      writeOnly: true
      description: 12-72 UTF-8 bytes (byte limits, not Unicode character limits); bcrypt hashed
    LoginInput:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password, writeOnly: true }
        remember: { type: boolean, default: false }
    CreateUserInput:
      type: object
      additionalProperties: false
      required: [username, password, role]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        password: { $ref: '#/components/schemas/Password' }
        displayName:
          type: string
          description: Optional, defaults to username if empty; valid UTF-8, at most 256 bytes
        role: { type: string, enum: [admin, member, viewer] }
    TokenData:
      type: object
      additionalProperties: false
      required: [user, accessToken, expiresIn]
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string, description: Short-lived Bearer JWT; keep in memory }
        expiresIn: { type: integer, format: int64, minimum: 1, description: 'Access lifetime in seconds, capped by the absolute session deadline' }
    ChangePasswordInput:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password, writeOnly: true }
        newPassword: { $ref: '#/components/schemas/Password' }
    UpdateUserInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: { type: string, enum: [admin, member, viewer] }
        disabled: { type: boolean }
    ResetPasswordInput:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { $ref: '#/components/schemas/Password' }
    SessionInfo:
      type: object
      additionalProperties: false
      required: [id, createdAt, expiresAt, remember, current]
      properties:
        id: { type: string, description: 'Opaque session identifier, not a token' }
        createdAt:
          type: integer
          format: int64
          description: Unix seconds; 0 means unknown for pre-migration sessions
        expiresAt: { type: integer, format: int64, description: 'Absolute Unix deadline, never extended by rotation' }
        remember: { type: boolean }
        current: { type: boolean, description: True for the session that issued the request }
    UserPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    Project:
      type: object
      additionalProperties: false
      required: [id, name, description, repoUrl, defaultBranch, status, visibility, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string }
        name:
          type: string
          description: 3-64 UTF-8 bytes, unique case-insensitively; no path or shell meta characters
        description:
          type: string
          description: At most 512 bytes
        repoUrl:
          type: string
          description: https:// or git@ git URL, file:/// URL, or an absolute local path; empty allowed
        defaultBranch:
          type: string
          description: Plain git ref name; empty allowed
        buildCommand:
          type: string
          description: Single-line shell command executed in a temporary workdir; builds require it
        status: { type: string, enum: [active, archived] }
        visibility:
          type: string
          enum: [public, private]
          description: |
            public (default) is readable by every authenticated role. private is
            visible only to global admins, the creator and project members; an
            invisible project answers 404 rather than 403.
        createdBy: { type: string, description: Actor id snapshot of the creating user }
        createdAt: { type: integer, format: int64, description: Unix seconds }
        updatedAt: { type: integer, format: int64, description: Unix seconds }
    ProjectInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        repoUrl: { type: string }
        defaultBranch: { type: string }
        buildCommand: { type: string, maxLength: 512 }
        visibility: { type: string, enum: [public, private], description: Defaults to public when omitted }
    ProjectPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string }
        description: { type: string }
        repoUrl: { type: string }
        defaultBranch: { type: string }
        buildCommand: { type: string, maxLength: 512 }
        visibility: { type: string, enum: [public, private] }
        archived:
          type: boolean
          description: true archives (idempotent); false restores an archived project
    ProjectMember:
      type: object
      additionalProperties: false
      required: [projectId, userId, username, role, createdBy, createdAt]
      properties:
        projectId: { type: string }
        userId: { type: string }
        username: { type: string, description: Resolved from the auth account; empty if the account no longer exists }
        role: { type: string, enum: [maintainer, viewer] }
        createdBy: { type: string, description: Actor id snapshot of who granted the membership }
        createdAt: { type: integer, format: int64, description: Unix seconds }
    ProjectMemberInput:
      type: object
      additionalProperties: false
      required: [userId, role]
      properties:
        userId: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
        role: { type: string, enum: [maintainer, viewer] }
    ProjectMemberPatch:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { type: string, enum: [maintainer, viewer] }
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    Build:
      type: object
      additionalProperties: false
      required: [id, projectId, buildNumber, status, branch, command, repoUrl, triggeredBy, createdAt, startedAt, finishedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        buildNumber: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled, interrupted], description: interrupted marks builds cut off by a restart }
        branch: { type: string }
        command: { type: string, description: Command snapshot at trigger time }
        repoUrl: { type: string, description: Repository URL snapshot at trigger time; empty means the build ran without cloning }
        triggeredBy: { type: string, description: Actor id snapshot }
        createdAt: { type: integer, format: int64, description: Unix seconds }
        startedAt: { type: integer, format: int64, description: Unix seconds; 0 while queued }
        finishedAt: { type: integer, format: int64, description: Unix seconds; 0 while unfinished }
    LogEvent:
      type: object
      additionalProperties: false
      required: [id, buildId, stream, message, createdAt]
      properties:
        id: { type: integer, format: int64, description: Monotonic event id; the polling cursor and future SSE resume sequence }
        buildId: { type: string }
        stream: { type: string, enum: [stdout, stderr, system] }
        message: { type: string, description: At most 4096 bytes per line, rune-boundary truncated }
        createdAt: { type: integer, format: int64, description: Unix seconds }
    BuildPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Build' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    DeploymentTarget:
      type: object
      additionalProperties: false
      required: [id, name, kind, environment, endpoint, healthPath, deployPath, hasSecret, status, createdBy, createdAt, updatedAt, lastCheckAt, lastCheckOk, lastCheckDetail]
      properties:
        id: { type: string }
        name: { type: string, description: Unique case-insensitively; 3-64 bytes on one line }
        kind: { type: string, enum: [http] }
        environment: { type: string, enum: [development, staging, production] }
        endpoint: { type: string, format: uri, description: http(s) URL without userinfo, query or fragment }
        healthPath: { type: string, description: Appended to endpoint for the probe; starts with / }
        deployPath: { type: string, description: Appended to endpoint for the deploy POST; starts with /, default /deploy }
        hasSecret: { type: boolean, description: Whether a sealed credential is stored; the secret itself is never returned }
        status: { type: string, enum: [active, disabled] }
        createdBy: { type: string, description: Actor id snapshot }
        createdAt: { type: integer, format: int64, description: Unix seconds }
        updatedAt: { type: integer, format: int64, description: Unix seconds }
        lastCheckAt: { type: integer, format: int64, description: Unix seconds of the last probe; 0 means never probed }
        lastCheckOk: { type: boolean }
        lastCheckDetail: { type: string, description: "ok, http <code>, timeout or a sanitized network error" }
    DeploymentTargetInput:
      type: object
      additionalProperties: false
      required: [name, endpoint]
      properties:
        name: { type: string, minLength: 3, maxLength: 64 }
        kind: { type: string, enum: [http], default: http }
        environment: { type: string, enum: [development, staging, production], default: development }
        endpoint: { type: string, format: uri, description: http(s) URL without userinfo, query or fragment }
        healthPath: { type: string, default: '/', maxLength: 256 }
        deployPath: { type: string, default: '/deploy', maxLength: 256 }
        secret: { type: string, writeOnly: true, maxLength: 4096, description: Sent as Authorization Bearer for probes and deploys; sealed at rest and never returned }
        status: { type: string, enum: [active, disabled], default: active }
    DeploymentTargetPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 3, maxLength: 64 }
        environment: { type: string, enum: [development, staging, production] }
        endpoint: { type: string, format: uri, description: http(s) URL without userinfo, query or fragment }
        healthPath: { type: string, maxLength: 256 }
        deployPath: { type: string, maxLength: 256 }
        secret: { type: string, writeOnly: true, maxLength: 4096, description: Omit to keep, empty string to clear, non-empty to replace }
        status: { type: string, enum: [active, disabled] }
    DeploymentTargetCheck:
      type: object
      additionalProperties: false
      required: [ok, statusCode, latencyMs, detail, checkedAt]
      properties:
        ok: { type: boolean }
        statusCode: { type: integer, minimum: 0, description: 0 when no HTTP response was received }
        latencyMs: { type: integer, format: int64, minimum: 0 }
        detail: { type: string, description: "ok, http <code>, timeout or a sanitized network error; never the secret" }
        checkedAt: { type: integer, format: int64, description: Unix seconds }
    DeploymentTargetPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeploymentTarget' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    Deployment:
      type: object
      additionalProperties: false
      required: [id, projectId, targetId, targetName, targetEndpoint, targetEnvironment, deploymentNumber, status, version, buildId, rollbackOf, approvalId, triggeredBy, detail, createdAt, startedAt, finishedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        targetId: { type: string }
        targetName: { type: string, description: Target name snapshot at trigger time }
        targetEndpoint: { type: string, description: Target endpoint snapshot at trigger time }
        targetEnvironment: { type: string, description: Target environment snapshot at trigger time }
        deploymentNumber: { type: integer, format: int64, minimum: 1, description: Per-project monotonic sequence }
        status: { type: string, enum: [queued, awaiting_approval, running, succeeded, failed, cancelled, interrupted, rejected], description: awaiting_approval means a pending approval blocks execution; rejected is terminal and set by a rejection or approval expiry }
        version: { type: string }
        buildId: { type: string, description: Optional succeeded build snapshot; empty when not linked }
        rollbackOf: { type: string, description: Source deployment id when this is a rollback; empty otherwise }
        approvalId: { type: string, description: Approval request id when the target environment required approval; empty otherwise }
        triggeredBy: { type: string, description: Actor id snapshot }
        detail: { type: string, description: "Terminal outcome such as http <code>, timeout or a sanitized network error; never a secret" }
        createdAt: { type: integer, format: int64, description: Unix seconds }
        startedAt: { type: integer, format: int64, description: Unix seconds; 0 while queued }
        finishedAt: { type: integer, format: int64, description: Unix seconds; 0 while unfinished }
    DeploymentPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Deployment' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    DeploymentEvent:
      type: object
      additionalProperties: false
      required: [id, deploymentId, stream, message, createdAt]
      properties:
        id: { type: integer, format: int64, description: Monotonic event id; the cursor for paging }
        deploymentId: { type: string }
        stream: { type: string, enum: [system, response] }
        message: { type: string, description: At most 4096 bytes per response line; lifecycle system lines are not capped by the response limit }
        createdAt: { type: integer, format: int64, description: Unix seconds }
    DeploymentEventPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeploymentEvent' }
    CreateDeploymentInput:
      type: object
      additionalProperties: false
      required: [targetId, version]
      properties:
        targetId: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
        version: { type: string, pattern: '^[A-Za-z0-9._+-]{1,64}$' }
        buildId: { type: string, description: Optional; must be a succeeded build of the same project }
    RollbackDeploymentInput:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: Empty object; the version to restore is the most recent earlier succeeded version of the same project and target.
    Approval:
      type: object
      additionalProperties: false
      required: [id, deploymentId, projectId, status, requestedBy, decidedBy, reason, createdAt, expiresAt, decidedAt]
      properties:
        id: { type: string }
        deploymentId: { type: string }
        projectId: { type: string }
        status: { type: string, enum: [pending, approved, rejected, expired], description: expired covers both the TTL scan and a deployment cancelled while awaiting approval }
        requestedBy: { type: string, description: Actor id that requested the deployment }
        decidedBy: { type: string, description: Admin actor id for approve/reject; empty for expiry }
        reason: { type: string, description: 'Optional rejection reason, "approval expired" or "deployment cancelled"; never a secret' }
        createdAt: { type: integer, format: int64, description: Unix seconds }
        expiresAt: { type: integer, format: int64, description: Unix seconds; createdAt + AEGIS_APPROVAL_TTL }
        decidedAt: { type: integer, format: int64, description: Unix seconds; 0 while pending }
    ApprovalPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Approval' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    RejectApprovalInput:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 512, description: 'Optional, trimmed, single line, no control characters; included in the audit detail' }
    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, createdAt, actorId, actorUsername, action, objectType, objectId, result, detail, requestId]
      properties:
        id: { type: string }
        createdAt: { type: integer, format: int64, description: Unix seconds }
        actorId: { type: string, description: Empty for system rows }
        actorUsername: { type: string }
        action: { type: string, enum: [auth.login, user.create, user.password_change, user.password_reset, user.disable, user.enable, user.role_change, session.revoke, session.revoke_all, project.create, project.update, project.archive, project.unarchive, project.member_add, project.member_update, project.member_remove, build.trigger, build.cancel, build.retry, deployment_target.create, deployment_target.update, deployment_target.remove, deployment_target.check, deployment.create, deployment.cancel, deployment.rollback, approval.request, approval.approve, approval.reject, approval.expire] }
        objectType: { type: string, enum: [user, session, project, build, deployment_target, deployment, approval] }
        objectId: { type: string }
        result: { type: string, enum: [success, failure] }
        detail: { type: string, description: Safe context such as role transitions or revoked counts; never secrets }
        requestId: { type: string, description: Links to the structured request log }
    AuditPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, requestId]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, validation_failed, unauthorized, forbidden, account_disabled, origin_denied, conflict, unsupported_media_type, rate_limited, not_found, not_ready, dependencies_unavailable, internal_error]
            message: { type: string, description: Human-readable safe detail; clients should branch on code/status }
        requestId: { $ref: '#/components/schemas/RequestID' }
  responses:
    Tokens:
      description: Access token and public user only; refresh secret is Set-Cookie only
      headers:
        Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, requestId]
            properties:
              data: { $ref: '#/components/schemas/TokenData' }
              requestId: { $ref: '#/components/schemas/RequestID' }
    User:
      description: Public user
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, requestId]
            properties:
              data: { $ref: '#/components/schemas/User' }
              requestId: { $ref: '#/components/schemas/RequestID' }
    BadRequest:
      description: Invalid JSON, unknown field, non-object or >16 KiB (invalid_request), or invalid user fields (validation_failed)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Invalid credentials or missing/invalid/expired/revoked Bearer/session; error.code is unauthorized
      headers:
        WWW-Authenticate: { $ref: '#/components/headers/BearerChallenge' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Missing/disallowed auth Origin or cross-site request (origin_denied), non-admin user (forbidden), or disabled account login (account_disabled)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Unknown resource id; error.code is not_found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Conflicting state; error.code is conflict (terminal deployment, duplicate target name, or a target with deployment history)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnsupportedMediaType:
      description: Missing/wrong Content-Type (application/json required); error.code is unsupported_media_type
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: Internal error; error.code is internal_error, no sensitive implementation details
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
